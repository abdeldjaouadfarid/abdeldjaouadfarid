<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="LOKA — real-time GPS livestock tracking"><title>LOKA — real-time GPS livestock tracking</title>
<style>.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16301f" stroke-width="0.6"/></pattern>
<radialGradient id="v" cx="70%" cy="45%" r="75%"><stop offset="0" stop-color="#0b1410" stop-opacity="0"/><stop offset="1" stop-color="#050a08" stop-opacity="0.85"/></radialGradient></defs>
